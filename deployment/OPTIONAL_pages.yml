# Optional workflow. It is not active in this folder.
# To use it: copy it to .github/workflows/pages.yml and set Settings > Pages > Source to "GitHub Actions".
# It builds the atlas from src/ and the website from docs/atlas/, runs the checks, and publishes docs/.
# It does not draw the diagram images: commit them after running tools/render_diagrams.py.
name: Build and publish the PFM Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/build_atlas.py
      - run: python tools/check_atlas.py
      - run: python tools/build_site.py
      - run: python tools/validate_site.py
      - run: python tools/validate_consolidated.py
      - run: python tools/check_budget_cycle_nav.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
